<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Audit Internal Produksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with tabs; form = single column of 4 audit sections + sticky score bar;
   dashboard = KPI strip, area x komponen heatmap, trend + komponen + recurring findings. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#eef2f5; --ink:#14202b; --muted:#5a6a78; --line:#d9e0e6;
  --accent:#0a6f9c; --accent-ink:#ffffff; --accent-soft:#dff0f8;
  --good:#17703f; --good-bg:#dff2e7; --warn:#8a5a00; --warn-bg:#faedc6; --bad:#b3204b; --bad-bg:#fae0e8;
  --na:#5f6d7a; --na-bg:#e6ebef;
  --c1:#2b5f9e; --c2:#b45f06; --c3:#1f7a6e; --c4:#6b4c98; --seg-ink:#ffffff;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#16202a; --surface2:#1d2935; --ink:#e7eef4; --muted:#93a3b2; --line:#2b3947;
  --accent:#4cb8e6; --accent-ink:#04222f; --accent-soft:#12303f;
  --good:#52c78c; --good-bg:#12301f; --warn:#e6b84a; --warn-bg:#3a2e0d; --bad:#ff86a6; --bad-bg:#3f1624;
  --na:#9aa8b5; --na-bg:#253240; --c1:#6ea8ee; --c2:#f0a25a; --c3:#4cc9b8; --c4:#b39bdc; --seg-ink:#06131d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --surface2:#1d2935; --ink:#e7eef4; --muted:#93a3b2; --line:#2b3947;
  --accent:#4cb8e6; --accent-ink:#04222f; --accent-soft:#12303f;
  --good:#52c78c; --good-bg:#12301f; --warn:#e6b84a; --warn-bg:#3a2e0d; --bad:#ff86a6; --bad-bg:#3f1624;
  --na:#9aa8b5; --na-bg:#253240; --c1:#6ea8ee; --c2:#f0a25a; --c3:#4cc9b8; --c4:#b39bdc; --seg-ink:#06131d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.tabs button{font:inherit;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.banner{margin-top:14px;padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.view{padding-top:18px;display:grid;gap:18px}
/* form */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
input[type=text],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:40px}
textarea{min-height:64px;resize:vertical}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 16px 14px;color:var(--muted);font-size:13px}
.sec{overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
.sec-h .pol{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-h .sc{font-family:var(--f-mono);font-size:13px}
.item{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.item:last-child{border-bottom:0}
.item.bad-field{box-shadow:inset 3px 0 0 var(--bad)}
.item-head{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start}
.num{font-family:var(--f-mono);color:var(--muted);padding-top:2px}
.req{font-weight:500;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;min-width:54px;min-height:44px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"][data-v="M"]{background:var(--good-bg);color:var(--good)}
.seg button[aria-checked="true"][data-v="DM"]{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-checked="true"][data-v="NA"]{background:var(--na-bg);color:var(--na)}
details.ref{margin-left:40px;color:var(--muted);font-size:13px}
details.ref summary{cursor:pointer;width:max-content;color:var(--accent);font-weight:500}
details.ref ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.dm{margin-left:40px;padding:12px;border:1px dashed var(--bad);border-radius:6px;background:color-mix(in srgb,var(--bad-bg) 55%,transparent);display:grid;gap:10px}
.dm .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sticky-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.parts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.parts b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.btn{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 18px;min-height:42px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:40;font-weight:500;max-width:90vw}
/* dashboard */
.bar-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.bar-top .ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{padding:14px 16px;display:grid;gap:4px}
.kpi .lab{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.kpi .sub{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.na{background:var(--na-bg);color:var(--na)}
.pnl{padding:16px;display:grid;gap:12px;min-width:0}
.pnl-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:center}
.hm td.c{text-align:center;font-family:var(--f-mono);font-weight:500;min-width:84px}
.hm td.c.good{background:var(--good-bg);color:var(--good)}.hm td.c.warn{background:var(--warn-bg);color:var(--warn)}.hm td.c.bad{background:var(--bad-bg);color:var(--bad)}.hm td.c.na{background:var(--na-bg);color:var(--na)}
.tot{display:flex;align-items:center;gap:8px;min-width:140px}
.tot .tb{flex:1;height:8px;background:var(--surface2);border-radius:4px;position:relative;overflow:hidden}
.tot .tb i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.tot .tb i.good{background:var(--good)}.tot .tb i.warn{background:var(--warn)}.tot .tb i.bad{background:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.rows{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.rrow .nm{min-width:0}
.rrow .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.rrow .track i{display:block;height:100%;background:var(--bad);border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:99px;background:var(--na-bg);color:var(--na);font-size:12px;font-weight:500}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .std{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.5}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* findings */
.fcard{padding:14px 16px;display:grid;gap:10px}
.fcard .hd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.fcard .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fcard .find{background:var(--bad-bg);color:var(--ink);padding:8px 10px;border-radius:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label.f{min-width:150px}
.ph{display:grid;gap:8px}
.ph-list{display:flex;flex-wrap:wrap;gap:8px}
.ph-item{position:relative}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface2);cursor:zoom-in;display:block}
.ph-x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer;line-height:1}
.ph-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph-btns label.btn{display:inline-flex;align-items:center}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
.login{max-width:420px;margin:28px auto 0;padding:20px;display:grid;gap:14px}
.roles{display:flex;width:100%}
.roles button{flex:1;font:inherit;font-weight:600;min-height:44px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.roles button:last-child{border-right:0}
.roles button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent)}
.roles button:disabled{opacity:.4;cursor:not-allowed}
#who{display:flex;gap:8px;align-items:center;padding-bottom:8px}
.btn.sm[aria-pressed="true"]{background:var(--accent-soft)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend2 i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg .sl{fill:var(--seg-ink);font-size:11px;font-weight:600}
svg .tl{font-size:10.5px;font-weight:600}
svg .an{fill:var(--ink);font-size:10.5px;font-weight:600}
.hm th.stick,.hm td.stick{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;min-width:150px}
.catpills{display:flex;flex-wrap:wrap;gap:4px}
.catpills .pill{font-size:11px;font-weight:500}
.hist-detail{padding:4px 0 8px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="9" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M17 2v30M2 17h30" stroke="var(--ink)" stroke-width="1.5"/><circle cx="17" cy="17" r="3" fill="var(--bad)"/></svg>
      <div><h1>Audit Internal</h1><small>Process Audit Checklist · 17 area produksi + 8 unit departemen · skor M / DM</small></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav><div id="who"></div>
  </div>
</header>
<main class="wrap"><div id="banner"></div><div id="view" class="view"></div></main>
<div id="bar"></div>
<div id="toast" class="toast" hidden></div>

<script>
const ITEMS = [{"n": 1, "t": "Approved sample tersedia dari Engineering", "r": "1. Sample yang digunakan benar sesuai item yang sedang jalan.\n2. Label hijau pengisian lengkap beserta verifikasinya"}, {"n": 2, "t": "(QAFA) Sample acuan / FRA sesuai Approved Sample", "r": "1. FRA tersedia dan sesuai item yang sedang jalan dan\n2. Pengisian label FRA lengkap dan benar sesuai sample.\n3. Kualitas FRA sesuai dengan approved sample."}, {"n": 3, "t": "Produk yang sedang berjalan sesuai dengan FRA dan toleransi / shade band", "r": "1. Identitas Item yang berjalan sesuai dengan RHHP, FRA, dan approved sample\n2. Kualitas produk yang ada di green bin/ palet sesuai dengan FRA, sample dan shadeband (jika ada) (untuk retail/pcs: sampling 10, untuk sheet: sampling 2)"}, {"n": 4, "t": "Toleransi atau limit sample defect tersedia", "r": "1. Limit sample, Shadeband, sample defect yang digunakan sesuai dengan produknya\n2. Limit sample hanya boleh di ACC oleh SPV - Manager QA/QC, PE dan Plant Manager\n3. Shadeband yang digunakan sudah di verifikasi oleh PE & Quality."}, {"n": 5, "t": "Reject telah dicatat dengan benar per 2 jam", "r": "1. Laporan reject workcenter tersedia \n2. Pengisian reject workcenter lengkap dan benar\n3. Kode reject dan qty reject dengan aktual barang reject sesuai."}, {"n": 6, "t": "Reject tidak melebihi standard yang sudah ditentukan", "r": "Printing: 5000 ppm\nDie cut: 3000 ppm\nProses lain: 2000 ppm\nIM: 3000 ppm\nppm pada laporan reject workcenter (kecuali reject setting)"}, {"n": 7, "t": "Parameter kualitas tersedia di area kerja (CTQ & Visual Defect)", "r": "1. CTQ & Visual Defect tersedia, benar, lengkap, dan diketahui operator di area kerja\n2. Operator mengetahui point-point CTQ & Visual Defect yang tersedia di area kerja"}, {"n": 8, "t": "Parameter proses (CTP) dan prosedur/AK dipenuhi", "r": "1. CTP & AK tersedia, benar, lengkap, dan diketahui operator di area kerja\n2. Operator mengetahui point-point CTP & AK yang tersedia di area kerja"}, {"n": 9, "t": "Andon yang tesedia berfungsi dan sesuai keadaan aktual", "r": "1. Operator mengerti penggunaan dan fungsi andon yang ada di mesin/area\n2. Andon sesuai dengan keadaan aktual"}, {"n": 10, "t": "Aktual produksi mengikuti Layout IE", "r": "1. Item yang berjalan sesuai dengan layout\n2. Jumlah dan jobdesc operator sesuai dengan layout \n3. Layout IE sesuai RHHP"}, {"n": 11, "t": "Kondisi mesin dan tools beroperasi dengan baik dan sesuai dengan toleransi atau batasan tertentu", "r": "1. Pengecekan part-part mesin dan tools sesuai dengan parameter\n2. Bagian-bagian mesin dan tools berfungsi dengan benar"}, {"n": 12, "t": "Defect produk telah dipisahkan atau diberi tanda/ Barang yang sudah dihold tidak melebihi 1x24 jam", "r": "1. Barang hold & reject tersegregasi dengan benar sesuai dengan tempatnya\n2. Barang reject /hold ada label identitas dengan isi yang benar dan jelas\n3. Barang hold dengan issue quality harus diselesaikan dalam 1x24 jam"}, {"n": 13, "t": "Red Bin / visual control dilakukan sesuai standar", "r": "1. Red bin/visual control digunakan sesuai fungsi\n2. Isi red bin/visual control tidak boleh melebihi ppm standard."}, {"n": 14, "t": "AM/TPM Harian Mesin dilakukan sesuai jadwal", "r": "1. AM/TPM Harian tersedia di setiap mesin dan point-point AM sesuai dengan mesinnya\n2. AM/TPM Harian diisi/ceklis sesuai dengan jadwal\n3. Operator melakukan TPM dengan benar (cek point TPM dan interview operator)"}, {"n": 15, "t": "Jadwal Produksi dan RHHP sesuai", "r": "1. RHHP tersedia\n2. Produk yang sedang berjalan sesuai dengan RHHP (tidak ditulis manual oleh operator)\n3. Pengisian RHHP benar, diisi per jam, dan sudah diverifikasi oleh planner & spv"}, {"n": 16, "t": "(QAFA) Lembar checksheet diisi tepat waktu dan benar sesuai dengan RHHP", "r": "1. Checksheet yang digunakan sesuai dengan proses dan acuan kerja\n2. Pengisian checksheet benar dan lengkap sesuai produk yang sedang proses (termasuk nama supplier & no lot/batch)\n3. Operator mengetahui point-point pada checksheet dan dilakukan dengan benar"}, {"n": 17, "t": "No. SPK/Lot/batch/PO tersedia untuk traceability", "r": "1. No. SPK/Lot/batch/PO tercantum pada RHHP dan checksheet\n2. No. SPK/PO pada checksheet sesuai dengan RHHP \n3. No.Lot/Batch material yang digunakan tercantum pada checksheet dan sesuai dengan aktual.\n4. Penulisan & penggunaan material di actual tercatat pada checklist dokumen/checksheet sesuai dengan material yang sudah diapproved oleh customer/sample awal (cek NPOF)"}, {"n": 18, "t": "Material yang digunakan sesuai sudah pass inspeksi incoming", "r": "Cek report incoming"}, {"n": 19, "t": "Jadwal Gemba / 5R / Kebersihan tersedia", "r": "1. Ceklist 5R tersedia di setiap mesin/area \n2. Ceklist 5R sesuai dengan jadwal\n3. Operator melakukan 5R dengan benar (cek point 5R dan interview operator)"}, {"n": 20, "t": "(QAFA) Perbaikan proses / Kaizen dilakukan secara kontinyu", "r": "1. Ada kaizen di area\n2. Action Plan dari kaizen dilakukan secara kontinyu\n3. Operator dan leader mengetahui action plan dari kaizen.\n(masa berlaku 3 bulan per kaizen)"}, {"n": 21, "t": "Follow up CAPA telah dilakukan sesuai rencana", "r": "CAPA Customer complain, audit internal, dan ketidaksesuaian lainnya:\n1. Pengisian CAPA lengkap, logis, dan diverifikasi oleh SPV/Leader & Dept head\n2. Action plan CAPA efektif (issue tidak berulang)\n3. Evidence harus terlampir (foto, data, daftar hadir dll)"}, {"n": 22, "t": "Problem yang sama tidak terulang", "r": "1. Defect mingguan tidak berulang dari report reject workcenter dan inspeksi QC (jika di atas standar ppm)"}, {"n": 23, "t": "Performance Monitoring In Process", "r": "1. Setiap area memiliki papan monitoring performance\n2. Papan performance di-update daily & weekly\n3. Pengisian papan performance lengkap"}, {"n": 24, "t": "Tidak ada permintaan sortir pada next process", "r": "Cek instruksi \"sortir next process\" pada label yang tertempel di barang."}, {"n": 25, "t": "Defect tidak ditemukan pada next process", "r": "1. Defect setiap proses produksi yang ditemukan next process tidak melebihi standar PPM\n2. Defect proses produksi tidak ditemukan di proses inspeksi QC (patrol, outgoing, full lot)"}, {"n": 26, "t": "Analisa penyebab masalah lengkap Man-Method-Machine", "r": "Analisa masalah pada NCR/CAPAR lengkap dan logis"}, {"n": 27, "t": "Tidak ada komplain external", "r": "Cek komplain  / inspeksi eksternal"}, {"n": 28, "t": "Trend quality membaik", "r": "PPM reject atau temuan inspeksi menurun / di bawah standar"}, {"n": 29, "t": "(QAFA) Barang tidak menghalangi area jalan", "r": "1. WIP/barang tidak berada di area jalan dan jalur evakuasi\n2. Tidak menghalangi/block APAR, Hydrant, dan panel listrik"}, {"n": 30, "t": "(QAFA) Barang tidak mepet tembok", "r": "Minimal 30 cm dari tembok"}, {"n": 31, "t": "(QAFA) Ventilasi/sirkulasi udara cukup", "r": "kipas menyala"}, {"n": 32, "t": "Barang dan tempatnya ada label atau tanda", "r": "1. WIP & hasil finished goods pada palet/ green bin harus ada label identitas dan area segregasi yang jelas. (Accept, hold, reject, FSC/NON FSC)\n2. Sharp tools harus ada identitas yang terdaftar di IE\n3. Wadah chemical diberi identitas yang jelas dan label hazard sesuai\n4. Wadah non- chemical/ WIP/Finished Goods diberi identitas yang jelas sesuai dengan fungsinya\n5. Material yg tersimpan di area produksi ada label yang jelas"}, {"n": 33, "t": "Alat ukur yang digunakan sesuai standar", "r": "Alat ukur ada label kalibrasi dan tidak kadarluarsa"}, {"n": 34, "t": "Hanya WIP yang akan diproses yang ada di area kerja", "r": "WIP terdaftar di RHHP"}, {"n": 35, "t": "(QAFA) Kondisi barang & tools yang digunakan baik dan disimpan dengan baik (teratur)", "r": "1. Alas WIP/Finished Goods di palet & meja kerja bersih dari debu, jejak sepatu, dan kotoran lainnya\n2. Alas WIP/Finished Goods menggunakan sisi non-print\n3. Tempat barang tidak menggunakan produk customer, tidak rusak, dan digunakan sesuai fungsinya.\n4. Barang& tools yang disimpan rapih dan sesuai dengan tempatnya.\n5. Lampu meja kerja menyala dengan optimal (tidak redup & mati)"}, {"n": 36, "t": "Tidak ada makanan dan minuman yang berwarna di area produksi", "r": ""}, {"n": 37, "t": "Barang & tools yang digunakan tidak berpotensi mengandung phtalate", "r": "Cek dengan incoming barang & tools yang digunakan sudah pass PH"}, {"n": 38, "t": "Tidak ada debu tebal, kotor, berkarat, atau sarang laba-laba", "r": "1. Mesin, WIP/Finished Goods, tools, & barang lain tidak berdebu (di-wrapping), berkarat, dan ada sarang laba-laba, wrapping\n2. Wadah, secondary contaiment, alas lantai tidak kotor"}, {"n": 39, "t": "Tidak ada resiko safety (Produksi)", "r": "1. Secondary contaiment pada benda cair\n2. Posisi palet bersandar pada barang\n3. Ada potensi karyawan tidak safety (palet bersandar, lampu meja kerja tidak terkait dengan benar, tidak memakai APD, kabel menjuntai)\n4. MSDS chemical tertempel dan menggunakan bahasa indo 26 bab/point\n4. Die block tidak pada tempatnya \n5. Safety issue pada mesin (oli bocor, pintu mesin tidak tertutup rapat, tombol &part-part mesin rusak/hilang, tidak ada getaran tak terduga, panas berlebihan)\n6. Kontaminasi issue \n7. Operator tidak boleh memakai kutek, aksesories tangan (gelang, cincin, dll)\nDLL (selain di list ini jika ada safety issue tetap temuan)"}];

fect classification"},{"n":16,"t":"Limit sample tersedia setiap ada temuan defect dalam proses","r":"Limit sample yang ditentukan oleh QC Inspector/SPV/Dept. Head"},{"n":17,"t":"Product Knowledge","r":"Interview Inspektor/Leader QC Inprocess perihal proses setiap item"},{"n":18,"t":"NCR Released dan report hold sesuai","r":"Jumlah issue, jumlah NCR yang sudah direlease sesuai dengan iAuditor/ checklist patrol"},{"n":19,"t":"Report inspeksi diisi dengan benar","r":"Pengecekan random sampling report di iAuditor\n- Penulisan tidak ada yang salah ketik (typo) \n- AQL yang digunakan sesuai\n- Kode reject dengan aktual defect sesuai"},{"n":20,"t":"Tidak ada komplain produksi/ kelolosan","r":"Terdata:\nTidak ada komplain issue printing, die cut, dan HS di produksi yang melebihi qty pengecekan\nCompare dengan FRA"},{"n":21,"t":"Inspektor menguasai acuan kerja/prosedur Inspeksi outgoing","r":"Auditor interview inspektor dan praktek pengecekan"},{"n":22,"t":"Inspektor menguasai pengendalian ketidaksesuaian lot","r":"Interview Inspektor/Leader QC"},{"n":23,"t":"Inspektor menguasai metode sampling","r":"AQL yang digunakan.\n- Major/minor defect classification"},{"n":24,"t":"Limit sample tersedia setiap ada temuan defect saat inspeksi outgoing","r":"Limit sample yang ditentukan oleh QC Inspector/SPV/Dept. Head (Untuk acuan sortir)"},{"n":25,"t":"Product Knowledge","r":"Interview Inspektor/Leader QC Outgoing perihal proses setiap item"},{"n":26,"t":"Report inspeksi diisi dengan benar","r":"Pengecekan random sampling report di iAuditor\n- Penulisan tidak ada yang salah ketik (typo) \n- AQL yang digunakan sesuai\n- Kode reject dengan aktual defect sesuai"},{"n":27,"t":"NCR Released dan report hold sesuai","r":"Jumlah issue, jumlah NCR yang sudah direlease sesuai dengan iAuditor"},{"n":28,"t":"Tidak ada Customer complaint","r":"Terdata:\nTidak ada customer complaint (data mingguan)"},{"n":29,"t":"Sample aktual terdata pada list sample","r":"Cek aktual sample dengan data list sample" /* ---------- scoring: M=1, DM=0, N/A excluded; section points = M/(M+DM) x weight ---------- */
function calc(ans,SC=SECS){
  let earned=0,wsum=0,answered=0,dm=0;
  const secs=SC.map(s=>{
    let m=0,d=0,na=0;
    for(let n=s.from;n<=s.to;n++){const a=ans[n]; if(a==='M')m++; else if(a==='DM')d++; else if(a==='NA')na++;}
    const sc=m+d, pct=sc?m/sc:null, pts=sc?pct*s.w:null;
    if(sc){earned+=pts;wsum+=s.w}
    answered+=m+d+na; dm+=d;
    return {k:s.k,name:s.name,m,d,na,pct,pts,w:s.w};
  });
  return {secs,total:wsum?earned/wsum*100:null,answered,dm};
}

function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let max=1280,out='';

function ddashHTML(){

    <div class="ctrl">${rangeCtrl()}<label class="f">Kolom heatmap<select id="dd-gran"><option value="week" ${S.gran==='week'?'selected':''}>Mingguan</option><option value="month" ${S.gran==='month'?'selected':''}>Bulanan</option></select></label>${scoped?'':'<button class="btn ghost" id="btn-csv-d" type="button">Unduh CSV skor</button>'}</div></div>`;

    <div class="card kpi"><span class="lab">Unit teraudit</span><span class="val">${done.length}<span class="muted" style="font-size:22px"> / ${units.length}</span></span><span class="sub">${units.length-done.length} unit belum diaudit</span></div>
    <div class="card kpi"><span class="lab">Di bawah standar</span><span class="val" style="color:var(--${below?'bad':'good'})">${below}</span><span class="sub">unit dengan skor &lt; ${STD}</span></div>
    <div class="card kpi"><span class="lab">Temuan belum closed</span><span class="val" style="color:var(--${fl.length?'bad':'good'})">${fl.length}</span><span class="sub">${overdue} lewat due date</span></div></div>`;
  const keys=[...new Set(list.map(a=>pKey(a.date)))].sort().slice(-12);

  const hv=rows.map(r=>{const vs=keys.map(k=>cell[r.u.id]&&cell[r.u.id][k]?calcOf(cell[r.u.id][k]).total:null),f=vs.filter(x=>x!=null);return {u:r.u,vs,avg:f.length?f.reduce((a,b)=>a+b,0)/f.length:null}});
  h+=`<section class="card pnl"><div class="pnl-h"><h3>Heatmap skor per unit</h3><span class="muted" style="font-size:12px">${keys.length?(S.gran==='month'?'per bulan':'per minggu, label = tanggal akhir minggu (Sabtu)')+', maks. 12 periode terakhir':''}. Hijau ≥ ${STD}, kuning ≥ ${WARN}, merah di bawahnya.</span></div>`;
  if(!keys.length)h+='<div class="empty">Tidak ada audit pada rentang tanggal ini.</div>';
  else{
    h+=`<div class="scroll"><table class="hm"><thead><tr><th class="stick">Unit</th>${keys.map(k=>`<th class="n">${pLab(k)}</th>`).join('')}<th class="n">Rata-rata</th></tr></thead><tbody>`;
    hv.forEach(r=>{h+=`<tr><td class="stick"><b>${esc(r.u.short)}</b><div class="muted" style="font-size:12px">${esc(r.u.dept)}</div></td>${r.vs.map((v,i)=>`<td class="c ${cls(v)}" ${v==null?'':`title="${esc(r.u.name)} · ${pLab(keys[i])}: ${v.toFixed(2)}"`}>${v==null?'–':v.toFixed(1)}</td>`).join('')}<td class="c ${cls(r.avg)}"><b>${r.avg==null?'–':r.avg.toFixed(1)}</b></td></tr>`});
    if(hv.length>1){const cav=keys.map((k,i)=>{const f=hv.map(r=>r.vs[i]).filter(x=>x!=null);return f.length?f.reduce((a,b)=>a+b,0)/f.length:null});const all=cav.filter(x=>x!=null);const ov=all.length?all.reduce((a,b)=>a+b,0)/all.length:null;
      h+=`<tr><td class="stick"><b>Rata-rata semua unit</b></td>${cav.map(v=>`<td class="c ${cls(v)}"><b>${v==null?'–':v.toFixed(1)}</b></td>`).join('')}<td class="c ${cls(ov)}"><b>${ov==null?'–':ov.toFixed(1)}</b></td></tr>`}
    h+='</tbody></table></div>';
  }
  h+='</section>';
  h+=`<section class="card pnl"><div class="pnl-h"><h3>Capaian kategori, audit terbaru</h3><span class="muted" style="font-size:12px">% = M ÷ (M + DM) pada kategori itu</span></div><div class="scroll"><table><thead><tr><th>Unit</th><th>Skor</th><th>Rincian kategori</th><th class="n">DM</th><th>Tgl audit</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    if(!r.au){h+=`<tr><td><b>${esc(r.u.short)}</b><div class="muted" style="font-size:12px">${esc(r.u.dept)}</div></td><td colspan="4"><span class="pill na">Belum diaudit</span></td></tr>`;return}
    const c=r.au.c;
    h+=`<tr><td><b>${esc(r.u.short)}</b><div class="muted" style="font-size:12px">${esc(r.u.dept)}</div></td><td><span class="pill ${cls(c.total)} mono">${fmt(c.total)}</span></td>
      <td><div class="catpills">${c.secs.map(s=>{const p=s.pct==null?null:s.pct*100;return `<span class="pill ${cls(p)}" title="${s.m} M, ${s.d} DM${s.na?', '+s.na+' N/A':''} · bobot ${fmtW(s.w)}">${esc(s.name)} ${p==null?'–':p.toFixed(0)+'%'}</span>`}).join('')}</div></td>
      <td class="n mono">${c.dm}</td><td class="muted">${dateLabel(r.au.date)}</td></tr>`;
  });
  h+=`</tbody></table></div></section>`;
  // trend + latest
  const sel=scoped?S.parea:S.dunit;let tl=list;if(sel!=='all')tl=tl.filter(a=>a.unit===sel);
  const map={};tl.forEach(a=>{const k=pKey(a.date),r=(map[k]=map[k]||{}),c=r[a.unit];if(!c||cmp(c,a)<0)r[a.unit]=a});
  const pts=Object.keys(map).sort().slice(-24).map(k=>{const l=Object.values(map[k]).map(a=>calcOf(a).total),v=l.reduce((a,b)=>a+b,0)/l.length;return {lab:pLab(k),v,tip:`${pLab(k)}: ${v.toFixed(1)} (${l.length} unit)`}});
  h+=`<div class="${scoped?'':'grid2'}"><section class="card pnl"><div class="pnl-h"><h3>Skor per ${S.gran==='month'?'bulan':'minggu'}</h3>${scoped?'':`<label class="f" style="min-width:200px"><select id="dd-unit"><option value="all">Rata-rata semua unit</option>${UNITS.map(u=>`<option value="${u.id}" ${S.dunit===u.id?'selected':''}>${esc(u.short)}</option>`).join('')}</select></label>`}</div>${legendBar()}<div class="scroll">${barSeries(pts,'Skor audit departemen per periode')}</div></section>
  ${scoped?'':`<section class="card pnl"><div class="pnl-h"><h3>Skor terbaru per unit</h3><span class="muted" style="font-size:12px">sumbu mulai dari 60</span></div>${legendBar()}${hbars(done.map(r=>({name:r.u.short,v:r.au.c.total,tip:`${r.u.name} · ${dateLabel(r.au.date)}: ${r.au.c.total.toFixed(1)}`})),'Skor audit terbaru per unit')}</section>`}</div>`;
  // top DM
  const cnt={};list.forEach(a=>{Object.keys(a.ans||{}).filter(n=>a.ans[n]==='DM').forEach(n=>{const k=a.unit+':'+n;(cnt[k]=cnt[k]||{c:0,u:UNIT(a.unit),n:+n}).c++})});
  const top=Object.values(cnt).sort((a,b)=>b.c-a.c).slice(0,8),mx=top.length?top[0].c:1;
  h+=`<section class="card pnl"><div class="pnl-h"><h3>Poin yang paling sering temuan</h3><span class="muted" style="font-size:12px">${rangeLabel()}</span></div>${top.length?`<div class="rows">${top.map(o=>{const it=o.u.items.find(i=>i.n===o.n);return `<div><div class="rrow"><div class="nm"><b>${esc(o.u.short)}</b> <span class="mono muted">#${o.n}</span> ${esc(it?it.t:'')}</div><span class="pill bad">${o.c}×</span></div><div class="rrow"><div class="track"><i style="width:${o.c/mx*100}%"></i></div></div></div>`}).join('')}</div>`:'<div class="empty">Tidak ada temuan DM pada rentang ini.</div>'}</section>`;
  return h;
}
/* ---------- photos display ---------- */
S.pc={};
function strip(ids){return (ids&&ids.length)?`<div class="ph-list">${ids.map(p=>`<img class="thumb" data-pid="${esc(p)}" alt="Foto bukti temuan">`).join('')}</div>`:''}
function hydrate(){
  document.querySelectorAll('img[data-pid]').forEach(async im=>{
    const p=im.dataset.pid;
    if(S.pc[p]){im.src=S.pc[p];return}
    if(!S.db||im.dataset.l)return; im.dataset.l=1;
    try{const s=await S.db.doc('photos/'+p).get();if(s.exists){S.pc[p]=s.data().data;im.src=S.pc[p]}}catch(e){}
  });

function lightbox(src){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${src}" alt="Foto bukti">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
async function addFindingPhotos(card,input,key){
  const aid=card.dataset.aid,n=card.dataset.n,src=card.dataset.src,coll=src==='d'?'daudits':'audits',a=(src==='d'?S.dauds:S.audits).find(x=>x.id===aid);if(!a||!S.db)return;
  let ids=((a.finds||{})[n]||{})[key]||[];
  for(const file of [...input.files]){
    if(ids.length>=8){toast('Maksimal 8 foto per temuan.');break}
    try{
      toast('Mengunggah foto…');
      const u=await compress(file),pid=aid+'_'+n+'_'+Date.now().toString(36);
      await S.db.doc('photos/'+pid).set({auditId:aid,n:+n,kind:key,data:u,createdAt:Date.now()});S.pc[pid]=u;
      ids=[...ids,pid];await S.db.doc(coll+'/'+aid).update({finds:{[n]:{[key]:ids}}});toast('Foto tersimpan');
    }catch(e){toast('Foto gagal diunggah.')}
  }
  input.value='';
}

function allFindings(){

  VD().forEach(a=>{const u=UNIT(a.unit)||{items:[],name:''};Object.entries(a.finds||{}).forEach(([n,f])=>{const it=u.items.find(i=>i.n===+n);out.push({src:'d',aid:a.id,n:+n,t:it?it.t:'',area:a.unitName||u.name,areaId:a.unit,date:a.date,f})})});
  return out.sort((x,y)=>(x.f.due||'9999').localeCompare(y.f.due||'9999'));
}

  return o.map(([v,l])=>`<option value="${v}" ${S.farea===v?'selected':''}>${esc(l)}</option>`).join('');
}

    <p class="muted" style="margin:0">${setup?'Belum ada PIN. Pilih Admin dan buat PIN admin. Lakukan ini lebih dulu sebelum link dibagikan ke tim.':'Pilih peran, lalu masukkan PIN.'}</p>
    <div class="seg roles" role="radiogroup" aria-label="Peran">${['prod','auditor','admin'].map(r=>`<button type="button" role="radio" data-lrole="${r}" aria-checked="${sel===r}" ${setup&&r!=='admin'?'disabled':''}>${ROLE_LABEL[r]}</button>`).join('')}</div>
    ${sel==='prod'?`<label class="f">Area atau unit Anda<select id="l-area"><optgroup label="Produksi">${S.areas.map((x,i)=>`<option value="${x.id}">${i+1}. ${esc(x.name)}</option>`).join('')}</optgroup><optgroup label="Departemen lain">${UNITS.map(u=>`<option value="${u.id}">${esc(u.dept)} · ${esc(u.name)}</option>`).join('')}</optgroup></select></label>`:''}
    <label class="f">${setup?'Buat PIN admin (min. 4 karakter)':'PIN'}<input type="password" id="l-pin" autocomplete="off"></label>
    <div id="l-msg" class="muted" style="min-height:18px"></div>
    <button class="btn" id="btn-login" type="button">${setup?'Buat PIN dan masuk':'Masuk'}</button>
    <div class="muted" style="font-size:12px">Produksi / Departemen: lihat tren dan isi action plan area atau unit sendiri. Auditor: isi form dan lihat semua. Admin: semua fitur dan pengaturan akses.</div></section>`;
}
async function doLogin(){
  const msg=$('#l-msg'),pin=$('#l-pin').value,a=S.access||{},setup=!a.admin,role=setup?'admin':(S.lrole||'prod');
  if(!pin){msg.textContent='Isi PIN.';return}
  if(!S.db){msg.textContent='Penyimpanan belum tersambung. Muat ulang halaman.';return}
  const h=await hash(role,pin);
  if(setup){
    if(pin.length<4){msg.textContent='PIN minimal 4 karakter.';return}
    try{await S.db.doc('config/access').set({admin:h});S.access={admin:h}}catch(e){msg.textContent='Gagal menyimpan PIN.';return}
  }else if(a[role]!==h){msg.textContent=a[role]?'PIN salah.':'PIN untuk peran ini belum diatur oleh admin.';return}
  S.role=role;S.parea=role==='prod'?$('#l-area').value:null;S.sess={role,area:S.parea,h};saveSess();
  S.tab=role==='auditor'?'input':'dash';$('#view').dataset.built='';render();window.scrollTo({top:0});
}
function accHTML(){
  const a=S.access||{};
  return `<div><h2>Akses dan PIN</h2><p class="muted" style="margin:4px 0 0">Kosongkan kolom yang tidak ingin diubah. Anggota tim mengganti peran hanya dengan PIN ini. Ini pembatas akses di aplikasi, bukan pengganti pengaturan Share. Bagikan link hanya ke orang di lingkungan kerja.</p></div>
  <section class="card pnl"><div class="meta" style="padding:0">${[['prod','Produksi'],['auditor','Auditor'],['admin','Admin']].map(([r,l])=>`<label class="f">PIN ${l} ${a[r]?'<span class="pill good">sudah diatur</span>':'<span class="pill bad">belum diatur</span>'}<input type="password" id="acc-${r}" autocomplete="off" placeholder="PIN baru"></label>`).join('')}</div>
  <div><button class="btn" id="btn-acc" type="button">Simpan PIN</button></div></section>`;
}
/* ---------- AREA SETTINGS ---------- */
function setHTML(){
  return `<div><h2>Daftar Area</h2><p class="muted" style="margin:4px 0 0">Sesuaikan nama area dengan area produksi sebenarnya. Perubahan nama berlaku untuk form dan dashboard, audit lama tetap tersimpan.</p></div>
  <section class="card pnl"><div class="meta" style="padding:0">${S.areas.map((a,i)=>`<label class="f">Area ${i+1}<input type="text" data-area="${a.id}" value="${esc(a.name)}" ${S.canWrite===false?'disabled':''}></label>`).join('')}</div>
  <div><button class="btn" id="btn-areas" type="button" ${S.canWrite===false?'disabled':''}>Simpan nama area</button></div></section>`;
}

/* ---------- CSV ---------- */
async function saveCSV(name,rows){
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  try{const d=await claude.use('downloads');if(!d){toast('Unduhan tidak tersedia di tampilan ini.');return}await d.save({filename:name,data:csv})}catch(e){if(!e||e.code!=='declined')toast('Unduhan gagal.')}
}
function csvScores(){
  const rows=[['Tanggal','Area','Auditor','Auditee','Product (19)','Process (31)','System (25)','Area Kerja (25)','Skor total','Jumlah DM']];
  S.audits.map(withCalc).sort(cmp).forEach(a=>rows.push([a.date,a.areaName||areaName(a.areaId),a.auditor,a.auditee,...a.c.secs.map(s=>s.pts==null?'':s.pts.toFixed(2)),a.c.total.toFixed(2),a.c.dm]));
  return rows;
}
function csvDept(){
  const rows=[['Tanggal','Departemen','Unit','Auditor','Auditee','Skor total','Jumlah DM']];
  S.dauds.slice().sort(cmp).forEach(a=>{const c=calcOf(a);rows.push([a.date,a.dept,a.unitName||(UNIT(a.unit)||{}).name,a.auditor,a.auditee,c.total.toFixed(2),c.dm])});
  return rows;
}
function csvFinds(){
  const rows=[['Tanggal','Area','No','Poin audit','Temuan','Action plan','PIC','Due date','Status','Jumlah foto temuan','Jumlah bukti action plan','Tanggal closed']];
  allFindings().forEach(x=>{rows.push([x.date,x.area,x.n,x.t,x.f.finding,x.f.plan||'',x.f.pic||'',x.f.due||'',x.f.status||'Open',(x.f.photos||[]).length,(x.f.donePhotos||[]).length,x.f.closedAt||''])});
  return rows;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const lr=e.target.closest('[data-lrole]');if(lr&&!lr.disabled){S.lrole=lr.dataset.lrole;render();return}
  if(e.target.closest('[data-logout]')){logout();return}
  if(e.target.id==='btn-login'){doLogin();return}
  if(e.target.id==='btn-acc'){
    if(S.role!=='admin')return;const upd={};
    for(const r of ['prod','auditor','admin']){const v=document.getElementById('acc-'+r).value;if(v){if(v.length<4){toast('PIN minimal 4 karakter.');return}upd[r]=await hash(r,v)}}
    if(!Object.keys(upd).length){toast('Belum ada PIN yang diisi.');return}
    try{await S.db.doc('config/access').set(Object.assign({},S.access||{},upd));if(upd.admin){S.sess.h=upd.admin;saveSess()}toast('PIN tersimpan');['prod','auditor','admin'].forEach(r=>document.getElementById('acc-'+r).value='')}catch(err){toast('Gagal menyimpan PIN.')}
    return;
  }
  if(e.target.classList&&e.target.classList.contains('thumb')&&e.target.src){lightbox(e.target.src);return}
  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo({top:0});return}
  if(t.dataset.preset){setPreset(t.dataset.preset);render();return}
  if(t.dataset.ftype){S.ftype=t.dataset.ftype;if(S.ftype==='d'&&!S.dform)S.dform=loadDraft(DKEYD,newDForm);$('#view').dataset.built='';render();return}
  if(t.closest('.seg')&&t.dataset.v){setAnswer(+t.closest('.item').dataset.n,t.dataset.v);return}
  if(t.id==='btn-save')return saveAudit();
  if(t.id==='btn-reset'){const f=FM(),keep={auditor:f.auditor,auditee:f.auditee};if(S.ftype==='d')S.dform=Object.assign(newDForm(),keep,{unitId:f.unitId});else S.form=Object.assign(newForm(),keep);clearDraft(S.ftype);$('#view').dataset.built='';render();toast('Form dikosongkan');return}
  if(t.id==='btn-csv-d')return saveCSV('skor-audit-departemen.csv',csvDept());
  if(t.id==='btn-csv')return saveCSV('skor-audit-internal.csv',csvScores());
  if(t.id==='btn-csv-find')return saveCSV('temuan-audit-internal.csv',csvFinds());
  if(t.dataset.rmph){const [n,i]=t.dataset.rmph.split(':');FM().photos[n].splice(+i,1);renderPhotos(n);saveDraft();return}
  if(t.dataset.exp){S.expand[t.dataset.exp]=!S.expand[t.dataset.exp];render();return}
  if(t.dataset.del){
    if(S.role!=='admin'){toast('Hanya admin yang bisa menghapus audit.');return}
    if(S.confirmDel!==t.dataset.del){S.confirmDel=t.dataset.del;render();return}
    S.confirmDel=null;try{const isD=S.dauds.some(x=>x.id===t.dataset.del),a=(isD?S.dauds:S.audits).find(x=>x.id===t.dataset.del);for(const f of Object.values((a&&a.finds)||{}))for(const p of [...(f.photos||[]),...(f.donePhotos||[])])await S.db.doc('photos/'+p).delete();await S.db.doc((isD?'daudits/':'audits/')+t.dataset.del).delete();toast('Audit dihapus')}catch(err){toast('Gagal menghapus.')}return;
  }
  if(t.id==='btn-areas'){
    const list=S.areas.map(a=>{const el=document.querySelector(`[data-area="${a.id}"]`);return {id:a.id,name:(el.value.trim()||a.name)}});
    try{await S.db.doc('config/areas').set({list});toast('Nama area tersimpan')}catch(err){toast('Gagal menyimpan nama area.')}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='l-pin')doLogin()});
document.addEventListener('input',e=>{
  const t=e.target,f=FM();
  if(S.tab!=='input')return;
  if(t.id==='f-auditor')f.auditor=t.value; else if(t.id==='f-auditee')f.auditee=t.value;
  else if(t.dataset.k==='find'){f.find[+t.closest('.item').dataset.n]=t.value;t.closest('.item').classList.remove('bad-field')}
  saveDraft();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.photo!==undefined){addFormPhotos(t);return}
  if(t.dataset&&t.dataset.addphoto!==undefined){addFindingPhotos(t.closest('.fcard'),t,t.dataset.addphoto);return}
  if(S.tab==='input'){
    if(t.id==='f-date')FM().date=t.value; else if(t.id==='f-area')S.form.areaId=t.value;
    else if(t.id==='f-unit'){S.dform.unitId=t.value;S.dform.ans={};S.dform.find={};S.dform.photos={};saveDraft();$('#view').dataset.built='';render();return}
    saveDraft();return;
  }
  if(t.id==='d-from'){S.from=t.value;S.preset='custom';render()}
  else if(t.id==='d-to'){S.to=t.value;S.preset='custom';render()}
  else if(t.id==='d-weeks'){S.weeks=+t.value;render()}
  else if(t.id==='d-trend'){S.trendArea=t.value;render()}
  else if(t.id==='dd-gran'){S.gran=t.value;render()}
  else if(t.id==='dd-unit'){S.dunit=t.value;render()}
  else if(t.id==='f-status'){S.fstatus=t.value;render()}
  else if(t.id==='f-farea'){S.farea=t.value;render()}
  else if(t.dataset.fk){
    const c=t.closest('.fcard'),aid=c.dataset.aid,n=c.dataset.n,patch={[t.dataset.fk]:t.value};
    if(t.dataset.fk==='status'){
      const au=(c.dataset.src==='d'?S.dauds:S.audits).find(x=>x.id===aid),f=((au&&au.finds)||{})[n]||{};
      if(t.value==='Closed'&&!(f.donePhotos||[]).length){toast('Unggah foto bukti action plan dulu sebelum Closed.');render();return}
      patch.closedAt=t.value==='Closed'?today():'';
    }
    updateFinding(aid,n,patch,c.dataset.src)}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.dirty&&!inField()){S.dirty=false;render()}},120)});
function inField(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#view')&&S.tab!=='input'}

/* ---------- boot ---------- */
function refresh(){if(!S.role)return;if(S.tab==='input'){renderTabs();renderBanner();return}if(inField()){S.dirty=true;renderTabs();return}render()}
(async function(){
  S.form=loadDraft(DKEY,newForm);S.dform=loadDraft(DKEYD,newDForm);
  try{const r=JSON.parse(localStorage.getItem(SKEY)||'null');if(r&&r.role){S.role=r.role;S.parea=r.area;S.sess=r;S.tab=r.role==='auditor'?'input':'dash'}}catch(e){}
  render();
  let db=null;
  try{db=await claude.use('db')}catch(e){}
  try{const u=await claude.use('user'); if(u){const c=await u.can('data.write'); if(c===false)S.canWrite=false}}catch(e){}
  S.db=db; render();
  if(!db)return;
  const valid=a=>a.date&&a.areaId&&(a.ans||(a.score&&a.score.total!=null));
  const merge=()=>{S.audits=[...(S.live||[]),...(S.histA||[])]};
  db.collection('audits').onSnapshot(snap=>{
    S.live=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(valid);
    merge();S.loaded=true;refresh();
  },err=>{S.dberr=err});
  db.collection('daudits').onSnapshot(snap=>{
    S.dauds=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(a=>a.unit&&a.date&&a.ans&&UNIT(a.unit));
    refresh();
  },()=>{});
  db.collection('history').onSnapshot(snap=>{
    S.histA=[];snap.docs.forEach(d=>((d.data()||{}).items||[]).forEach(x=>{if(valid(x))S.histA.push(x)}));
    merge();refresh();
  },()=>{});
  db.doc('config/access').onSnapshot(snap=>{
    S.access=snap.exists?snap.data():null;
    if(S.role&&S.access&&S.sess&&S.access[S.role]&&S.access[S.role]!==S.sess.h){logout(true);return}
    if(!S.role){if(!(document.activeElement&&document.activeElement.id==='l-pin'))render()}
  },()=>{});
  db.doc('config/areas').onSnapshot(snap=>{
    const d=snap.exists&&snap.data();
    if(d&&Array.isArray(d.list)&&d.list.length){const byId={};d.list.forEach(a=>byId[a.id]=a.name);S.areas=DEFAULT_AREAS.map(a=>({id:a.id,name:byId[a.id]||a.name}))}
    else S.areas=DEFAULT_AREAS;
    if(!S.role){if(!(document.activeElement&&document.activeElement.id==='l-pin'))render();return}
    if(S.tab==='input'){const sel=$('#f-area');if(sel){sel.innerHTML=S.areas.map((a,i)=>`<option value="${a.id}" ${a.id===S.form.areaId?'selected':''}>${i+1}. ${esc(a.name)}</option>`).join('')}}
    else refresh();
  },()=>{});
})();
</script>
